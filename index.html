<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Установка российского мессенджера Max</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: url('gradient1.png') no-repeat center center;
      background-size: cover;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .container {
      width: 90%;
      max-width: 500px;
      padding: 30px;
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 70%);
      border-radius: 40px;
      backdrop-filter: blur(10px);
      z-index: 10;
      box-shadow: none;
    }

    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 20px;
    }

    .progress-label {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 10px;
    }

    /* Анимированный прогресс-бар */
    .progress-container {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: #222;
      margin-bottom: 20px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      width: 73%;
      height: 100%;
      background: linear-gradient(to right, #0a00ff, #5e00ff);
      animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.8; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }

    .btn {
      background: linear-gradient(to right, #201874, #270b64);
      color: white;
      border: none;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 12px;
      width: 100%;
      margin-top: 25px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      box-shadow: none;
    }
    .btn:hover {
      transform: scale(1.05);
    }
    .btn:active {
      transform: scale(0.98) translateY(4px);
    }

    /* Футер */
    .footer {
      margin-top: 30px;
      padding: 10px 0;
      border-top: 1px solid #333;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 12px;
      color: #aaa;
    }
    .footer a {
      color: #fff;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }

    /* Экран после нажатия */
    .prank-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: black;
      z-index: 100;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .fullscreen-video {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 99;
      display: none;
    }

    .prank-text {
      font-size: 8vw;
      color: #ff0040;
      margin-bottom: 20px;
      text-shadow: 0 0 20px #ff004088;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* Блокируем "назад" */
    .block-back {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0);
      z-index: 200;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Основной диалог -->
  <div class="container" id="install-dialog">
    <div class="logo">
      <img src="max.png" alt="Max Logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8cmVjdCB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgZmlsbD0iIzAwMCIvPgogIDxjaXJjbGUgY3g9IjYwIiBjeT0iNjAiIHI9IjQwIiBmaWxsPSIjZmZmIi8+Cjwvc3ZnPg==';">
    </div>
    <h2>Установка Max</h2>
    <div class="subtitle">Максимум возможностей для жизни</div>
    <div class="progress-label">Загрузка: 73%</div>
    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>
    <button class="btn" id="cancel-btn">Отменить установку</button>

    <!-- Футер -->
    <div class="footer">
      <div>MAX © 2025</div>
      <a href="#">Ответы на вопросы</a>
      <a href="#">Политика конфиденциальности</a>
      <a href="#">Пользовательское соглашение</a>
      <a href="#">Техническая документация</a>
    </div>
  </div>

  <!-- Экран пранка -->
  <div class="prank-screen" id="prank-screen">
    <video class="fullscreen-video" id="prank-video" autoplay muted playsinline loop>
      <source src="video.mp4" type="video/mp4">
      Ваш браузер не поддерживает video.
    </video>
    <div class="prank-text">NFC PRANK!</div>
    <p style="color:#aaa;font-size:20px;margin-bottom:30px">Ты сам нажал «Отменить»…</p>
    <p style="color:#fff;font-size:16px">Теперь твой телефон знает, кто тут босс 🫡</p>
  </div>

  <!-- Блокиратор "назад" -->
  <div class="block-back" id="block-back"></div>

  <script>
    const cancelBtn = document.getElementById('cancel-btn');
    const installDialog = document.getElementById('install-dialog');
    const prankScreen = document.getElementById('prank-screen');
    const prankVideo = document.getElementById('prank-video');
    const blockBack = document.getElementById('block-back');

    // Блокируем "назад" в браузере
    window.history.pushState(null, null, window.location.href);
    window.addEventListener('popstate', function() {
      window.history.pushState(null, null, window.location.href);
    });

    // При нажатии — запускаем пранк
    cancelBtn.onclick = function() {
      // Убираем диалог
      installDialog.style.display = 'none';

      // Включаем видео на весь экран
      prankScreen.style.display = 'flex';
      prankVideo.style.display = 'block';

      // Разблокируем звук — через touchstart (на Android работает!)
      setTimeout(() => {
        prankVideo.muted = false;
        prankVideo.play().catch(e => {
          console.log("Autoplay blocked, trying to fake interaction...");
          const fakeClick = new MouseEvent('click', { bubbles: true });
          document.dispatchEvent(fakeClick);
          setTimeout(() => prankVideo.play(), 100);
        });
      }, 100);

      // Убираем блокировку "назад" через 5 сек (чтобы не мучать жертву)
      setTimeout(() => {
        blockBack.style.pointerEvents = 'auto';
      }, 5000);
    };
  </script>

</body>
</html>
